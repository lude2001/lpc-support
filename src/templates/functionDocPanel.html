<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPC 函数文档中心</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand-block">
                <span class="brand-mark" aria-hidden="true">ƒ</span>
                <div>
                    <h1>函数文档中心</h1>
                    <p id="document-path">等待当前文档…</p>
                </div>
            </div>
            <div class="status-block">
                <span id="status-dot" class="status-dot is-loading" aria-hidden="true"></span>
                <span id="status-text" role="status" aria-live="polite">正在连接语言服务</span>
                <button id="refresh-button" class="icon-button" type="button" title="刷新" aria-label="刷新函数文档">↻</button>
            </div>
        </header>

        <section class="toolbar" aria-label="函数筛选工具栏">
            <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="search-input" type="search" placeholder="搜索函数、签名、参数或文档" autocomplete="off">
                <kbd>Ctrl K</kbd>
            </label>
            <div class="filter-rail" role="group" aria-label="来源范围">
                <button class="filter-chip is-active" type="button" data-filter-group="scope" data-filter-value="all">全部</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="local">当前文件</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="inherit">继承</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="include">包含</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="simulEfun">模拟函数</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="efun">Efun</button>
            </div>
            <div class="filter-rail" role="group" aria-label="文档状态">
                <button class="filter-chip is-active" type="button" data-filter-group="quality" data-filter-value="all">全部状态</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="complete">完整</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="incomplete">待补充</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="inconsistent">不一致</button>
            </div>
            <div class="filter-rail" role="group" aria-label="声明种类">
                <button class="filter-chip is-active" type="button" data-filter-group="kind" data-filter-value="all">全部声明</button>
                <button class="filter-chip" type="button" data-filter-group="kind" data-filter-value="implementation">实现</button>
                <button class="filter-chip" type="button" data-filter-group="kind" data-filter-value="prototype">原型</button>
            </div>
        </section>

        <main class="workspace">
            <aside class="catalog" aria-label="函数目录">
                <div class="catalog-heading">
                    <span>可见声明</span>
                    <span id="result-count" class="count-pill">0</span>
                </div>
                <div id="function-list" class="function-list" role="tree" aria-label="函数声明列表"></div>
            </aside>

            <section id="detail-panel" class="detail-panel" aria-label="函数详情">
                <div class="empty-state">
                    <div class="empty-glyph" aria-hidden="true">{ }</div>
                    <h2>选择一个函数</h2>
                    <p>从左侧目录查看结构化签名、来源关系与文档质量。</p>
                </div>
            </section>
        </main>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
