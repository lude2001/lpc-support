<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{panelTitle}}</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand-block">
                <span class="brand-mark" aria-hidden="true">ƒ</span>
                <div>
                    <h1>{{heading}}</h1>
                    <p id="document-path">{{waitingDocument}}</p>
                </div>
            </div>
            <div class="status-block">
                <span id="status-dot" class="status-dot is-loading" aria-hidden="true"></span>
                <span id="status-text" role="status" aria-live="polite">{{connectingService}}</span>
                <button id="refresh-button" class="icon-button" type="button" title="{{refresh}}" aria-label="{{refreshDocumentation}}">↻</button>
            </div>
        </header>

        <section class="toolbar" aria-label="{{filterToolbar}}">
            <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="search-input" type="search" placeholder="{{searchPlaceholder}}" aria-label="{{searchLabel}}" autocomplete="off">
                <kbd>Ctrl K</kbd>
            </label>
            <div class="filter-rail" role="group" aria-label="{{sourceScope}}">
                <button class="filter-chip is-active" type="button" data-filter-group="scope" data-filter-value="all">{{all}}</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="local">{{currentFile}}</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="inherit">{{inherited}}</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="include">{{included}}</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="simulEfun">{{simulatedEfuns}}</button>
                <button class="filter-chip" type="button" data-filter-group="scope" data-filter-value="efun">{{efun}}</button>
            </div>
            <div class="filter-rail" role="group" aria-label="{{documentationStatus}}">
                <button class="filter-chip is-active" type="button" data-filter-group="quality" data-filter-value="all">{{allStatuses}}</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="complete">{{complete}}</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="incomplete">{{incomplete}}</button>
                <button class="filter-chip" type="button" data-filter-group="quality" data-filter-value="inconsistent">{{inconsistent}}</button>
            </div>
            <div class="filter-rail" role="group" aria-label="{{declarationKind}}">
                <button class="filter-chip is-active" type="button" data-filter-group="kind" data-filter-value="all">{{allDeclarations}}</button>
                <button class="filter-chip" type="button" data-filter-group="kind" data-filter-value="implementation">{{implementation}}</button>
                <button class="filter-chip" type="button" data-filter-group="kind" data-filter-value="prototype">{{prototype}}</button>
            </div>
        </section>

        <main class="workspace">
            <aside class="catalog" aria-label="{{functionCatalogue}}">
                <div class="catalog-heading">
                    <span>{{visibleDeclarations}}</span>
                    <span id="result-count" class="count-pill">0</span>
                </div>
                <div id="function-list" class="function-list" role="tree" aria-label="{{declarationList}}"></div>
            </aside>

            <section id="detail-panel" class="detail-panel" aria-label="{{functionDetails}}">
                <div class="empty-state">
                    <div class="empty-glyph" aria-hidden="true">{ }</div>
                    <h2>{{selectFunction}}</h2>
                    <p>{{selectionHelp}}</p>
                </div>
            </section>
        </main>
    </div>
    <script id="function-panel-localization" type="application/json" nonce="{{nonce}}">{{localizationData}}</script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
