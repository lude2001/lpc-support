name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    env:
      CI: true
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout FluffOS
        uses: actions/checkout@v6
        with:
          repository: lude2001/fluffos
          path: fluffos

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test CI diagnostics handling
        run: npm run test:ci-tools

      - name: Check localization resources and contracts
        run: |
          npm run check:l10n
          npm run test:l10n

      - name: Type check
        run: npm run check

      - name: Test Tree-sitter grammar
        working-directory: rust/grammar/lpc
        run: npx tree-sitter test

      - name: Audit bundled LPC fixtures
        run: npm run audit:rust-syntax -- test/lpc_code --strict

      - name: Check Rust
        run: npm run check:rust

      - name: Test Rust
        run: |
          npm run test:rust
          npm run test:rust-formatter

      - name: Compare TypeScript and Rust Efun localization consumers
        run: npm run test:efun-localization-consumers

      - name: Build and smoke-test Rust LSP
        run: |
          npm run build:rust
          npm run test:rust-smoke
          npm run test:rust-localization

      - name: Run tests
        run: npm test -- --runInBand

      - name: Audit efun arity docs
        run: npm run audit:efun-arity:strict-arity -- --fluffos-root "${{ github.workspace }}\\fluffos"

      - name: Package extension
        run: npm run package

      - name: Verify packaged bilingual resources and native target
        run: node --input-type=module -e "import fs from 'node:fs'; import {checkVsixLocalization} from './scripts/localization/check-vsix-localization.mjs'; const files=fs.readdirSync('.').filter(f=>f.startsWith('lpc-support-')&&f.endsWith('.vsix')); if(files.length!==1) throw new Error('Expected exactly one built VSIX'); console.log(JSON.stringify(await checkVsixLocalization(files[0],{target:'win32-x64'})));"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpc-support-vsix
          path: lpc-support-*.vsix
          if-no-files-found: error
          retention-days: 14

  platform-packages:
    name: Package ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            java-version: 17
          - os: windows-11-vs2026-arm
            target: win32-arm64
            java-version: 21
          - os: ubuntu-latest
            target: linux-x64
            java-version: 17
          - os: ubuntu-24.04-arm
            target: linux-arm64
            java-version: 17
          - os: macos-15-intel
            target: darwin-x64
            java-version: 17
          - os: macos-14
            target: darwin-arm64
            java-version: 17
    runs-on: ${{ matrix.os }}
    env:
      CI: true
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx512m
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Package native extension
        run: npm run package
      - name: Verify packaged bilingual resources and native target
        run: node --input-type=module -e "import fs from 'node:fs'; import {checkVsixLocalization} from './scripts/localization/check-vsix-localization.mjs'; const files=fs.readdirSync('.').filter(f=>f.startsWith('lpc-support-')&&f.endsWith('.vsix')); if(files.length!==1) throw new Error('Expected exactly one built VSIX'); console.log(JSON.stringify(await checkVsixLocalization(files[0],{target:'${{ matrix.target }}'})));"
      - name: Smoke-test the native sidecar included in this platform package
        run: |
          npm run test:rust-smoke
          npm run test:rust-localization
      - name: Upload platform VSIX
        uses: actions/upload-artifact@v4
        with:
          name: lpc-support-${{ matrix.target }}
          path: lpc-support-*.vsix
          if-no-files-found: error
          retention-days: 14
